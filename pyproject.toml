[project]
name = "trustforge-zero"
version = "0.1.0"
description = "Autonomous security, repair, and certification platform for enterprise AI agent fleets."
requires-python = ">=3.11"
dependencies = [
  "google-adk[gcp]>=2.0.0,<3.0.0",
  "google-genai>=1.0.0",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
